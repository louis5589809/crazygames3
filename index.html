<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewatch: Zombie Defense 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card {
            background: rgba(15, 18, 28, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff9e59;
            margin-bottom: 5px;
        }

        .card .value {
            font-size: 28px;
            font-weight: 800;
        }

        .health-bar-bg {
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.3s ease;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 158, 89, 0.9);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        /* Screen overlays */
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        #instructions {
            text-align: center;
            color: #fff;
            max-width: 500px;
            padding: 40px;
            background: rgba(20, 24, 38, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(255, 158, 89, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        #instructions h1 {
            color: #ff9e59;
            font-size: 32px;
            margin-bottom: 10px;
        }

        #instructions p {
            color: #a0a5b5;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
        }
        .controls-grid div span {
            color: #ff9e59;
            font-weight: bold;
        }

        #play-btn {
            background: linear-gradient(135deg, #ff9e59, #ff6b35);
            border: none;
            color: #fff;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 158, 89, 0.5);
        }

        /* First Person Weapon HUD View */
        #weapon-hud {
            position: absolute;
            bottom: 0;
            right: 20%;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 2;
        }
        #gun-mesh {
            position: absolute;
            bottom: -20px;
            right: 20px;
            width: 140px;
            height: 220px;
            background: #2a2d34;
            border-left: 8px solid #1a1b1e;
            transform: rotate(-15deg);
            border-radius: 10px 10px 0 0;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.05s;
        }
        #gun-barrel {
            position: absolute;
            top: -40px;
            left: 20px;
            width: 30px;
            height: 100px;
            background: #111;
            border-radius: 5px 5px 0 0;
        }
        #muzzle-flash {
            position: absolute;
            top: -70px;
            left: 5px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff 20%, #ffaa00 60%, transparent 80%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.05s;
        }
        #fist-mesh {
            position: absolute;
            bottom: -80px;
            left: -100px;
            width: 100px;
            height: 100px;
            background: #d49a6a;
            border-radius: 50%;
            transition: transform 0.1s;
        }
    </style>
    <!-- Three.js Engine & Pointer Lock Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div class="hud-top">
            <div class="card">
                <h2>Tower Health</h2>
                <div class="health-bar-bg">
                    <div id="health-fill" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="card" style="text-align: right;">
                <h2>Zombies Remaining</h2>
                <div id="zombie-count" class="value" style="color: #ff4b2b;">0</div>
            </div>
        </div>
        <div id="crosshair"></div>
        <div id="interaction-prompt">Press [E] to Drive Truck</div>

        <!-- 1st Person Weapon Simulation Overlay -->
        <div id="weapon-hud">
            <div id="fist-mesh"></div>
            <div id="gun-mesh">
                <div id="gun-barrel"></div>
                <div id="muzzle-flash"></div>
            </div>
        </div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1>NIGHTWATCH DEFENSE</h1>
            <p>Defend the Firewatch lookout tower from incoming cartoon zombies under the midnight sky.</p>
            
            <div class="controls-grid">
                <div><span>WASD</span> : Move / Drive</div>
                <div><span>Mouse</span> : Look Around</div>
                <div><span>Left Click</span> : Shoot Gun</div>
                <div><span>Right Click</span> : Punch</div>
                <div><span>Space</span> : Jump</div>
                <div><span>E</span> : Enter / Exit Truck</div>
            </div>

            <button id="play-btn">START GAME</button>
        </div>
    </div>

    <script>
        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060814);
        scene.fog = new THREE.FogExp2(0x0a0d1d, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Game State Variables
        let towerHealth = 100;
        let isDriving = false;
        let canShoot = true;
        let zombies = [];
        let bullets = [];
        let wave = 1;

        // Player State
        const player = {
            height: 1.8,
            speed: 0.12,
            velocity: new THREE.Vector3(),
            onGround: true,
            position: new THREE.Vector3(0, 1.8, 15)
        };

        // Inputs State
        const keys = {};
        let pitch = 0, yaw = 0;

        // --- LIGHTING & ENVIRONMENT (Firewatch Vibe) ---
        const ambientLight = new THREE.AmbientLight(0x2d3258, 0.8);
        scene.add(ambientLight);

        // Warm Tower Deck Spotlight
        const towerLight = new THREE.PointLight(0xff9e59, 2.5, 30);
        towerLight.position.set(0, 10.5, 0);
        towerLight.castShadow = true;
        scene.add(towerLight);

        // Moonlight
        const moonLight = new THREE.DirectionalLight(0x7982b9, 1.2);
        moonLight.position.set(-30, 50, -30);
        moonLight.castShadow = true;
        scene.add(moonLight);

        // Starfield & Moon
        createStarfield();

        function createStarfield() {
            const starsGeo = new THREE.BufferGeometry();
            const count = 1200;
            const positions = new Float32Array(count * 3);
            for(let i=0; i<count*3; i+=3) {
                positions[i] = (Math.random() - 0.5) * 400;
                positions[i+1] = Math.random() * 150 + 10;
                positions[i+2] = (Math.random() - 0.5) * 400;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.8});
            scene.add(new THREE.Points(starsGeo, starsMat));

            // Moon
            const moonGeo = new THREE.SphereGeometry(4, 16, 16);
            const moonMat = new THREE.MeshBasicMaterial({color: 0xfffbe3});
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(-60, 80, -80);
            scene.add(moon);
        }

        // Terrain Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x121824, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Forest Trees
        createForest();
        function createForest() {
            const trunkMat = new THREE.MeshStandardMaterial({color: 0x2c1d11});
            const leavesMat = new THREE.MeshStandardMaterial({color: 0x0d2b1d, roughness: 0.8});

            for(let i=0; i<70; i++) {
                let x = (Math.random() - 0.5) * 160;
                let z = (Math.random() - 0.5) * 160;
                if(Math.sqrt(x*x + z*z) < 18) continue; // Keep clearing clear around tower

                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), trunkMat);
                trunk.position.y = 1.5;
                tree.add(trunk);

                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 7, 5), leavesMat);
                leaves.position.y = 5;
                leaves.castShadow = true;
                tree.add(leaves);

                tree.position.set(x, 0, z);
                scene.add(tree);
            }
        }

        // --- FIREWATCH LOOKOUT TOWER BUILD ---
        const towerGroup = new THREE.Group();
        scene.add(towerGroup);

        const woodMat = new THREE.MeshStandardMaterial({color: 0x5c3a21, roughness: 0.7});
        const roofMat = new THREE.MeshStandardMaterial({color: 0x2b1810});

        // 4 Main Pillars
        for(let x of [-3, 3]) {
            for(let z of [-3, 3]) {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 10), woodMat);
                pillar.position.set(x, 5, z);
                towerGroup.add(pillar);
            }
        }
        // Deck Platform
        const deck = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 8), woodMat);
        deck.position.set(0, 10, 0);
        towerGroup.add(deck);

        // Cabin Cabin Room & Roof
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 5), new THREE.MeshStandardMaterial({color: 0x82522e, transparent: true, opacity: 0.85}));
        cabin.position.set(0, 11.7, 0);
        towerGroup.add(cabin);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(5.5, 2, 4), roofMat);
        roof.position.set(0, 14.2, 0);
        roof.rotation.y = Math.PI / 4;
        towerGroup.add(roof);

        // Walkable Stairs Geometry
        const stairsGroup = new THREE.Group();
        for(let i=0; i<20; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.6), woodMat);
            step.position.set(0, i * 0.5, 4 + (i * 0.4));
            stairsGroup.add(step);
        }
        towerGroup.add(stairsGroup);

        // --- DRIVABLE TRUCK BUILD ---
        const truck = new THREE.Group();
        const truckBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 4.5), new THREE.MeshStandardMaterial({color: 0xc4432b}));
        truckBody.position.y = 1;
        truckBody.castShadow = true;
        truck.add(truckBody);

        const cabinRoof = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 2), new THREE.MeshStandardMaterial({color: 0x111}));
        cabinRoof.position.set(0, 1.9, -0.2);
        truck.add(cabinRoof);

        // Wheels
        const wheelMat = new THREE.MeshStandardMaterial({color: 0x050505});
        for(let wx of [-1.3, 1.3]) {
            for(let wz of [-1.5, 1.5]) {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12), wheelMat);
                wheel.rotation.z = Math.PI/2;
                wheel.position.set(wx, 0.5, wz);
                truck.add(wheel);
            }
        }
        truck.position.set(8, 0, 8);
        scene.add(truck);
        let truckSpeed = 0;

        // --- ZOMBIE SPAWNING SYSTEM ---
        const zombieMat = new THREE.MeshStandardMaterial({color: 0x3d7049, roughness: 0.5});
        const eyeMat = new THREE.MeshBasicMaterial({color: 0x55ff55});

        function spawnZombie() {
            const zombie = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), zombieMat);
            body.position.y = 1.1;
            zombie.add(body);

            // Head & Glowing Eyes
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), zombieMat);
            head.position.y = 2.0;
            zombie.add(head);

            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08), eyeMat);
            eyeL.position.set(-0.15, 2.05, 0.3);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.15;
            zombie.add(eyeL); zombie.add(eyeR);

            // Spawn at random forest edge
            const angle = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * 20;
            zombie.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);

            scene.add(zombie);
            zombies.push({mesh: zombie, hp: 2});
        }

        function startWave() {
            for(let i=0; i < 8 + wave * 4; i++) {
                setTimeout(spawnZombie, i * 1200);
            }
            document.getElementById('zombie-count').innerText = 8 + wave * 4;
        }
        startWave();

        // --- CONTROLS & EVENT LISTENERS ---
        const blocker = document.getElementById('blocker');
        const playBtn = document.getElementById('play-btn');

        playBtn.addEventListener('click', () => {
            canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                blocker.style.display = 'none';
            } else {
                blocker.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== canvas) return;

            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        });

        document.addEventListener('keydown', (e) => { 
            keys[e.code] = true; 
            if(e.code === 'KeyE') toggleTruckDrive();
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== canvas) return;
            if (e.button === 0) shootWeapon(); // Left click shoot
            if (e.button === 2) punchMelee();  // Right click punch
        });

        // Disable right click context menu in game
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- PLAYER ACTIONS ---
        function shootWeapon() {
            if(!canShoot || isDriving) return;
            canShoot = false;

            // FX
            const muzzle = document.getElementById('muzzle-flash');
            const gun = document.getElementById('gun-mesh');
            muzzle.style.opacity = '1';
            gun.style.transform = 'rotate(-15deg) translateY(15px)';
            
            setTimeout(() => { 
                muzzle.style.opacity = '0';
                gun.style.transform = 'rotate(-15deg)';
                canShoot = true; 
            }, 150);

            // Bullet Raycasting
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(zombies.map(z => z.mesh), true);
            if(intersects.length > 0) {
                let hitObj = intersects[0].object;
                while(hitObj.parent && hitObj.parent !== scene) {
                    hitObj = hitObj.parent;
                }
                // Damage Zombie
                const zIndex = zombies.findIndex(z => z.mesh === hitObj);
                if(zIndex !== -1) {
                    zombies[zIndex].hp--;
                    if(zombies[zIndex].hp <= 0) {
                        scene.remove(zombies[zIndex].mesh);
                        zombies.splice(zIndex, 1);
                        updateZombieUI();
                    }
                }
            }
        }

        function punchMelee() {
            if(isDriving) return;
            const fist = document.getElementById('fist-mesh');
            fist.style.transform = 'translate(60px, -60px)';
            setTimeout(() => { fist.style.transform = 'translate(0, 0)'; }, 150);

            // Melee Hit check
            zombies.forEach((z, idx) => {
                if(player.position.distanceTo(z.mesh.position) < 3) {
                    z.hp -= 2;
                    if(z.hp <= 0) {
                        scene.remove(z.mesh);
                        zombies.splice(idx, 1);
                        updateZombieUI();
                    }
                }
            });
        }

        function toggleTruckDrive() {
            const distToTruck = player.position.distanceTo(truck.position);
            if(!isDriving && distToTruck < 4) {
                isDriving = true;
                document.getElementById('weapon-hud').style.display = 'none';
                document.getElementById('crosshair').style.display = 'none';
            } else if(isDriving) {
                isDriving = false;
                player.position.copy(truck.position).add(new THREE.Vector3(2, 1, 0));
                document.getElementById('weapon-hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
            }
        }

        function updateZombieUI() {
            document.getElementById('zombie-count').innerText = zombies.length;
            if(zombies.length === 0) {
                wave++;
                startWave();
            }
        }

        // --- GAME TICK & ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (document.pointerLockElement === canvas) {
                if (!isDriving) {
                    // --- PLAYER MOVEMENT & STAIR CLIMBING ---
                    const moveDir = new THREE.Vector3();
                    if (keys['KeyW']) moveDir.z -= 1;
                    if (keys['KeyS']) moveDir.z += 1;
                    if (keys['KeyA']) moveDir.x -= 1;
                    if (keys['KeyD']) moveDir.x += 1;
                    moveDir.normalize();

                    // Rotate move vector based on Yaw
                    const euler = new THREE.Euler(0, yaw, 0, 'YXZ');
                    moveDir.applyEuler(euler);

                    player.position.addScaledVector(moveDir, player.speed);

                    // Physical Stair Climb Logic for Tower
                    let targetY = player.height;
                    // Check if player is on tower stairs path (z: 4 to 12, x near 0)
                    if(Math.abs(player.position.x) < 1.5 && player.position.z > 3.5 && player.position.z < 12.5) {
                        let stairRatio = (12.5 - player.position.z) / 9.0;
                        targetY = player.height + (stairRatio * 10);
                    } else if(Math.abs(player.position.x) < 4 && Math.abs(player.position.z) < 4 && player.position.y > 8) {
                        // On Deck
                        targetY = 10 + player.height;
                    }

                    // Smooth height gravity transition
                    player.position.y += (targetY - player.position.y) * 0.1;

                    // Camera position sync
                    camera.position.copy(player.position);
                    camera.rotation.set(0, 0, 0);
                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;

                    // Interaction prompt check
                    const distToTruck = player.position.distanceTo(truck.position);
                    document.getElementById('interaction-prompt').style.display = (distToTruck < 4) ? 'block' : 'none';

                } else {
                    // --- TRUCK DRIVING CONTROLS ---
                    if (keys['KeyW']) truckSpeed = Math.min(truckSpeed + 0.01, 0.35);
                    if (keys['KeyS']) truckSpeed = Math.max(truckSpeed - 0.01, -0.15);

                    if (keys['KeyA']) truck.rotation.y += 0.03 * (truckSpeed > 0 ? 1 : -1);
                    if (keys['KeyD']) truck.rotation.y -= 0.03 * (truckSpeed > 0 ? 1 : -1);

                    truck.translateZ(truckSpeed);
                    truckSpeed *= 0.95; // Friction

                    // Third Person Camera Follow for Truck
                    const camOffset = new THREE.Vector3(0, 4, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), truck.rotation.y);
                    camera.position.copy(truck.position).add(camOffset);
                    camera.lookAt(truck.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

                    // Run over Zombies with Truck!
                    zombies.forEach((z, idx) => {
                        if(truck.position.distanceTo(z.mesh.position) < 2.2 && Math.abs(truckSpeed) > 0.05) {
                            scene.remove(z.mesh);
                            zombies.splice(idx, 1);
                            updateZombieUI();
                        }
                    });
                }

                // --- ZOMBIE AI & ATTACK LOOP ---
                zombies.forEach(z => {
                    // Move towards Lookout Tower center (0,0,0)
                    const dir = new THREE.Vector3(0, 0, 0).sub(z.mesh.position);
                    dir.y = 0;
                    dir.normalize();

                    z.mesh.position.addScaledVector(dir, 0.035);
                    z.mesh.lookAt(0, z.mesh.position.y, 0);

                    // Damage Tower when reaching base
                    if(z.mesh.position.distanceTo(new THREE.Vector3(0,0,0)) < 3.5) {
                        towerHealth = Math.max(0, towerHealth - 0.05);
                        document.getElementById('health-fill').style.width = towerHealth + '%';
                        
                        if(towerHealth <= 0) {
                            alert("GAME OVER! The Lookout Tower was destroyed.");
                            location.reload();
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate();
    </script>
</body>
</html>
